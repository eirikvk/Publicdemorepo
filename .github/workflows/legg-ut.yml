# Bygger siden og legger den ut på GitHub Pages ved hver push til main. Kan også startes for hånd under Actions.
# Krever at GitHub Pages bruker «GitHub Actions» som kilde: Settings → Pages → Build and deployment → Source.
# Hver action er låst til en bestemt commit, med versjonen i kommentaren. Da kan ikke en endring hos leverandøren
# endre det som kjøres, uten at det skjer en endring her.
name: Bygg og legg ut

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Én utlegging om gangen. En utlegging som er i gang, avbrytes ikke av en ny push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer pakkene fra package-lock.json
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Sjekk navn og skillet mellom regning og tegning
        run: npm run sjekk
      - name: Bygg
        run: npm run bygg
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  legg-ut:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.utlegging.outputs.page_url }}
    steps:
      - id: utlegging
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
